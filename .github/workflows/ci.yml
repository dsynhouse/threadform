name: Studio checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install -r tests/requirements-formats.txt
      - run: npm run check:types
      - run: npm run lint
      - run: npm run check:all
      - run: npm run build:vercel
      - run: npm run build
      - run: node --test tests/*.test.mjs
